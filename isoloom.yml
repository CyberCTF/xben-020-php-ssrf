# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-020-24 PHP SSRF (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a PHP app that fetches URLs for you, next to an internal PHP service that is not published.
# The benchmark folder benchmarks/XBEN-020-24 is vendored unchanged, split between build/internal-service/app/ and build/web/app/ (its ssrf-demo-app/ folder);
# both machines build from overlays of their own Dockerfiles (the internal one bakes in the flag).
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-020-php-ssrf

networks:
  lab: { cidr: 10.61.63.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    depends_on: [internal-service]
    docker:
      build: build/web

  internal-service:
    networks: { lab: 11 }
    services: [{ port: 80, name: web, http: true }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/internal-service

checks:
  - name: the web service answers
    http: http://web/
    expect: any
    wait: 180
  - name: the benchmark's page / is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-020-24 (PHP SSRF) answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Can you reach the internal service? Start from the index of the exposed web server.
